<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' https: data:; connect-src 'self' https: wss:; frame-src 'self' blob: data:;">
  <meta name="theme-color" content="#5c73f2">
  <meta name="description" content="Plan and manage your European trip locations">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EuroTrip">
  <title>{% block title %}Euro Trip Planner{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.svg?v=2">
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon-192.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260915_11">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
  <script>
    // Safeguard against upstream Chromium/DevTools web-vitals soft-navigation bug
    window.addEventListener('error', function(e) {
      if (e && e.message && (
        e.message.includes("Cannot read properties of undefined (reading 'startTime')") ||
        e.message.includes("message channel closed before a response was received")
      )) {
        var stack = (e.error && e.error.stack) || '';
        if (stack.includes('reportAllChanges') || stack.includes('VM') || !e.filename) {
          e.preventDefault();
        }
      }
    });
    // Safeguard against Chrome Extensions unhandled promise rejections (message port closed)
    window.addEventListener('unhandledrejection', function(e) {
      var reasonStr = (e && e.reason && (e.reason.message || String(e.reason))) || '';
      if (reasonStr.includes("message channel closed before a response was received") ||
          reasonStr.includes("A listener indicated an asynchronous response")) {
        e.preventDefault();
      }
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.warn('SW registration failed:', err);
        });
      });
    }
    // Set fallback title in case translations fail or take too long
    window.addEventListener('DOMContentLoaded', () => {
      if (!document.title || document.title === 'Loading...') {
        document.title = 'EuroTrip';
      }
    });
  </script>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  {% block page_scripts %}
  <script src="{{ url_for('static', filename='js/components/location-subcards.js') }}?v=20260915_11" defer></script>
  <script type="module" src="{{ url_for('static', filename='js/app.js') }}?v=20260915_11"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  {% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
