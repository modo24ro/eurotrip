services:
  eurotrip:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eurotrip-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-eurotrip-super-secret-key-change-in-production}
      - PYTHONUNBUFFERED=1
      - USE_SSL=${USE_SSL:-0}
    volumes:
      # Persist trips, locations, versions, backups and attachments
      - ./trips:/app/trips
      # Persist configuration and passwords
      - ./config.json:/app/config.json
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/login', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - eurotrip-network

networks:
  eurotrip-network:
    driver: bridge
